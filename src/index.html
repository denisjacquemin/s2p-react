<!DOCTYPE html>
<html>
	<head>
		<meta charset="utf-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="description" content="">
    <meta name="viewport" content="width=device-width, initial-scale=1">
		<title></title>
		<link rel="stylesheet" href="assets/css/fonts.css">
		<link rel="stylesheet" href="assets/css/global.css">
		<link rel="stylesheet" href="assets/css/codes.css">
		<link rel="stylesheet" href="assets/css/message.css">
		<link rel="stylesheet" href="assets/css/fadein.css">
		<link rel="stylesheet" href="assets/vendor/slick.css">
		<link rel="stylesheet" href="assets/css/disable_copypaste.css">
		<script src="assets/vendor/jquery-2.2.2.min.js"></script>
		<script src="assets/vendor/imgcache.js"></script>
		<script src="assets/vendor/imagesloaded.pkgd.js"></script>
		<script src="cordova.js"></script>
	</head>
	<body>
		<div id="root"></div>
		<script src="app.js"></script>
		<script>
			function initPushwoosh() {
					var pushNotification = cordova.require("pushwoosh-cordova-plugin.PushNotification");

					//set push notification callback before we initialize the plugin
					document.addEventListener('push-notification', function(event) {
																			//get the notification payload
																			var notification = event.notification;

																			//display alert to the user for example
																			alert(notification.aps.alert);

																			//clear the app badge
																			pushNotification.setApplicationIconBadgeNumber(0);
																	});

					//initialize the plugin
					pushNotification.onDeviceReady({pw_appid:"43CCF-B338D"});

					//register for pushes
					pushNotification.registerDevice(
							function(status) {
									var deviceToken = status['deviceToken'];
									console.warn('pushwoosh registerDevice: ' + deviceToken);
							},
							function(status) {
									console.warn('pushwoosh failed to register : ' + JSON.stringify(status));
									//alert(JSON.stringify(['failed to register ', status]));
							}
					);

					//reset badges on app start
					pushNotification.setApplicationIconBadgeNumber(0);
			}

			function initImgcache() {
				ImgCache.options.debug = true;
        ImgCache.options.usePersistentCache = true;

				ImgCache.init(function() {
					handleImageCache()
				})

			 $('body').imagesLoaded()
			 		.progress( function( instance, image ) {
				    var result = image.isLoaded ? 'loaded' : 'broken';
				    console.log( 'image is ' + result + ' for ' + image.img.src );
				  });
			}

			function handleImageCache() {
				$('img').each(function(index) {
					var img = $(this);
					ImgCache.isCached(img.attr('src'), function(path, success) {
						if (success) {
							// already cached
							console.log('Image ' + path + ' already cached')
							ImgCache.useCachedFile(img);
						} else {
							// not there, need to cache the image
							console.log('need to cache ' + path)
							ImgCache.cacheFile(img.attr('src'),
								function success() {
									console.log ('cacheFile success for ' + img.attr('src'));
									ImgCache.useCachedFile(img,
										function success () {
										console.info('now using local copy');
										},
										function error() {
											console.info('could not load from cache');
										}
									);
								},
								function error (err) {
									console.error('error cacheFile: ' + err)
								}
							);
						}
					});
				});
				console.log('Cache size: ' + ImgCache.getCurrentSize());
			}

			function onDeviceReady() {
				console.log('Device Ready')
				//initPushwoosh();
				initImgcache();
			}

			$(function() {
					var url = document.URL;
					var isSmart = (url.indexOf("http://") === -1 && url.indexOf("https://") === -1);
					if( isSmart ){
						console.log('isSmartPhone')
						document.addEventListener('deviceready', onDeviceReady, false);
					}
					else {
						console.log('not isSmartPhone')
					}
			})
		</script>
	</body>
</html>
